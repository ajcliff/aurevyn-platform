<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AUREVYN — Offline</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1A0F14;color:#F3E9ED;font-family:system-ui,sans-serif;text-align:center;padding:24px}
  .tile{width:64px;height:64px;border-radius:18px;background:#C9A227;color:#1A0F14;font-weight:800;font-size:30px;display:grid;place-items:center;margin:0 auto 18px}
  h1{font-size:20px;margin:0 0 8px} p{color:#C9B8C0;font-size:14px;max-width:320px;margin:0 auto 20px;line-height:1.5}
  button{background:#C9A227;color:#1A0F14;border:0;border-radius:8px;padding:10px 18px;font-weight:700;cursor:pointer;font-size:14px}
</style>
</head>
<body>
  <div>
    <div class="tile">A</div>
    <h1>You're offline</h1>
    <p>AUREVYN needs a connection to load. Check your internet and try again. Sales you already queued in POS are saved on this device and will sync when you're back online.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
